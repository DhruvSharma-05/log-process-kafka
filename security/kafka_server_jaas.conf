// SASL/PLAIN credentials for the production-like profile (Security NFR).
//
// Dev credentials only — these are committed deliberately so the profile is
// runnable from a clone. A real deployment injects this file from a secret
// store and never commits it.
//
//   admin   / admin-secret     super user, inter-broker auth
//   logpipe / logpipe-secret   application account (producer + processor)

KafkaServer {
    org.apache.kafka.common.security.plain.PlainLoginModule required
    username="admin"
    password="admin-secret"
    user_admin="admin-secret"
    user_logpipe="logpipe-secret";
};
