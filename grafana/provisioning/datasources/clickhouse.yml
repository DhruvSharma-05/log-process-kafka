apiVersion: 1

datasources:
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      secure: false
      username: default
      defaultDatabase: logpipe
      defaultTable: logs_hot
      # Panels filter on event time; alerting reads the most recent window.
      dialTimeout: 10
      queryTimeout: 60
    secureJsonData:
      password: ""
