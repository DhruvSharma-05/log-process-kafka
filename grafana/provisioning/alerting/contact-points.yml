apiVersion: 1

# FR4.3 — deliver alerts to an external channel.
#
# The webhook URL comes from the SLACK_WEBHOOK_URL environment variable (set it
# in .env). Without a real URL the rule still evaluates and shows as Firing in
# the Grafana UI; only the delivery leg fails. That keeps the repo runnable by
# anyone without handing out a live webhook.
contactPoints:
  - orgId: 1
    name: slack-oncall
    receivers:
      - uid: slack-oncall-webhook
        type: slack
        settings:
          url: $SLACK_WEBHOOK_URL
          title: '{{ template "slack.title" . }}'
          text: '{{ template "slack.text" . }}'
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: slack-oncall
    group_by: ["alertname", "service"]
    # On-call wants to know fast (FR4.2: "within a minute").
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 1h

templates:
  - orgId: 1
    name: slack.title
    template: |
      {{ define "slack.title" -}}
      [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}
      {{- end }}
  - orgId: 1
    name: slack.text
    template: |
      {{ define "slack.text" -}}
      {{ range .Alerts -}}
      *Service:* {{ .Labels.service }}
      *Error rate:* {{ index .Values "A" | printf "%.2f" }}%  (threshold 5%)
      *Started:* {{ .StartsAt.Format "15:04:05 MST" }}
      {{ if .Annotations.summary }}{{ .Annotations.summary }}{{ end }}
      {{ end -}}
      {{- end }}
