apiVersion: 1

# FR4.2 — fire when a service's error rate exceeds a configurable threshold
# over a configurable window. Defaults: >5% over 5 minutes.
#
# Both knobs live in the SQL below (INTERVAL 5 MINUTE) and the threshold
# expression (params: [5]). The `for: 1m` clause means the condition must hold
# for a full minute before firing, which suppresses single-window blips.
groups:
  - orgId: 1
    name: service-error-rate
    folder: Logpipe
    interval: 30s
    rules:
      - uid: logpipe-error-rate
        title: Service error rate above 5%
        condition: THRESHOLD
        for: 1m
        # A service with no traffic is not a healthy service to alert on, but it
        # is also not an error spike — stay quiet rather than page on silence.
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
          pipeline: logpipe
        annotations:
          summary: "Error rate on {{ $labels.service }} exceeded 5% over the last 5 minutes."
          runbook: "Check the Service Health dashboard, then the dead-letter-queue topic for parse failures."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: clickhouse
            model:
              refId: A
              editorType: sql
              format: 2
              # HAVING count() >= 20 avoids paging on a service that served
              # three requests, two of which happened to fail.
              rawSql: >
                SELECT service,
                       round(100 * countIf(is_error) / count(), 3) AS error_rate
                FROM logpipe.logs_hot
                WHERE timestamp > now() - INTERVAL 5 MINUTE
                GROUP BY service
                HAVING count() >= 20
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [5]

  # M5 — health of the pipeline itself, not of the services it observes.
  - orgId: 1
    name: pipeline-health
    folder: Logpipe
    interval: 30s
    rules:
      - uid: logpipe-consumer-lag
        title: Kafka consumer lag is growing
        condition: THRESHOLD
        # Bursts are normal and expected to drain (the PRD's success metric is
        # <60s to clear a 2x spike). Only sustained lag is worth waking someone.
        for: 3m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          pipeline: logpipe
        annotations:
          summary: "Consumer group {{ $labels.consumergroup }} is more than 50k messages behind."
          runbook: "Check the Pipeline Health dashboard. If throughput is flat, the processor is down or stuck; if throughput is high, scale consumers or add partitions."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum by (consumergroup) (kafka_consumergroup_lag_sum{consumergroup!~"_confluent.*"})
              range: true
              instant: false
              intervalMs: 30000
              maxDataPoints: 100
          - refId: REDUCE
            datasourceUid: __expr__
            model:
              refId: REDUCE
              type: reduce
              reducer: last
              expression: A
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: REDUCE
              conditions:
                - evaluator:
                    type: gt
                    params: [50000]

      - uid: logpipe-dlq-rate
        title: Dead-letter rate elevated
        condition: THRESHOLD
        for: 2m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          pipeline: logpipe
        annotations:
          summary: "Events are being dead-lettered at more than 5/s — likely a producer format change or schema drift."
          runbook: "Inspect the dead-letter-queue topic (make dlq). Group by error_stage: 'parse' means a new log format, 'validate' means schema drift."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum(rate(logpipe_processor_dlq_total[5m]))
              range: true
              instant: false
              intervalMs: 30000
              maxDataPoints: 100
          - refId: REDUCE
            datasourceUid: __expr__
            model:
              refId: REDUCE
              type: reduce
              reducer: last
              expression: A
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: REDUCE
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
